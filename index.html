<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>😈 Acchiappa il Bottone</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: radial-gradient(circle at top, #2c3e50, #111827 70%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .app {
      width: min(920px, calc(100vw - 24px));
      background: rgba(15, 23, 42, 0.82);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      position: relative;
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(2rem, 4vw, 3.2rem);
      color: #f1c40f;
      text-shadow: 0 2px 0 rgba(0,0,0,.35);
    }
    .subtitle {
      text-align: center;
      margin: 0 0 18px;
      opacity: .9;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: #34495e;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,.18);
    }
    .btn:hover { transform: translateY(-2px); background: #2ecc71; }
    .btn:active { transform: translateY(1px) scale(.98); }
    .btn.secondary { background: #8e44ad; }
    .btn.secondary:hover { background: #9b59b6; }
    .stage {
      position: relative;
      width: 100%;
      height: min(62vh, 520px);
      border-radius: 22px;
      border: 2px dashed rgba(255,255,255,0.14);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      overflow: hidden;
    }
    .scoreboard {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 14px;
      font-size: 1rem;
    }
    .pill {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 10px 14px;
    }
    .target {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 96px;
      height: 96px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(180deg, #ff7675, #d63031);
      color: white;
      font-size: 2rem;
      box-shadow: 0 14px 30px rgba(0,0,0,.28);
      cursor: pointer;
      transition: left .16s ease, top .16s ease, transform .16s ease, background .16s ease, width .16s ease, height .16s ease;
      touch-action: manipulation;
    }
    .target:hover { background: linear-gradient(180deg, #ff9f43, #e17055); }
    .target.caught {
      background: linear-gradient(180deg, #00b894, #16a085);
      transform: translate(-50%, -50%) scale(1.08) rotate(10deg);
    }
    .message {
      text-align: center;
      margin-top: 14px;
      min-height: 1.5em;
      font-weight: 700;
    }
    .footer {
      margin-top: 14px;
      text-align: center;
      opacity: .85;
      font-size: .95rem;
    }
    @media (max-width: 640px) {
      .app { padding: 16px; border-radius: 20px; }
      .stage { height: 58vh; }
      .target { width: 82px; height: 82px; font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>😈 Acchiappa il Bottone</h1>
    <p class="subtitle">Cliccalo prima che scappi via!</p>

    <div class="topbar">
      <button class="btn" id="startBtn">Gioca</button>
      <button class="btn secondary" id="resetBtn">Reset</button>
      <button class="btn" id="commentsBtn">Commenti</button>
      <button class="btn" id="funBtn">fun.games</button>
    </div>

    <div class="scoreboard">
      <div class="pill">Punti: <span id="score">0</span></div>
      <div class="pill">Tentativi: <span id="tries">0</span></div>
      <div class="pill">Tempo: <span id="time">30</span>s</div>
    </div>

    <section class="stage" id="stage" aria-label="Area di gioco">
      <button class="target" id="target" aria-label="Bottone da acchiappare">🔥</button>
    </section>

    <div class="message" id="message">Premi “Gioca” per iniziare.</div>
    <div class="footer">Divertente, veloce e un po' cattivo. Proprio come deve essere.</div>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const target = document.getElementById('target');
    target.tabIndex=-1;
    target.blur();
    const scoreEl = document.getElementById('score');
    const triesEl = document.getElementById('tries');
    const timeEl = document.getElementById('time');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const commentsBtn = document.getElementById('commentsBtn');
    const funBtn = document.getElementById('funBtn');

    let score = 0;
    let tries = 0;
    let timeLeft = 30;
    let timer = null;
    let running = false;

    function randomPos() {
      const maxX = stage.clientWidth - target.offsetWidth - 8;
      const maxY = stage.clientHeight - target.offsetHeight - 8;
      const x = Math.max(8, Math.floor(Math.random() * Math.max(8, maxX)));
      const y = Math.max(8, Math.floor(Math.random() * Math.max(8, maxY)));
      target.style.left = x + 'px';
      target.style.top = y + 'px';
      target.style.transform = 'none';
    }

    function updateUI() {
      scoreEl.textContent = score;
      triesEl.textContent = tries;
      timeEl.textContent = timeLeft;
    }

    function endGame() {
      running = false;
      clearInterval(timer);
      timer = null;
      messageEl.textContent = 'Tempo finito! Hai totalizzato ' + score + ' punti.';
      startBtn.textContent = 'Rigioca';
      target.classList.add('caught');
    }

    function startGame() {
      score = 0;
      tries = 0;
      timeLeft = 30;
      running = true;
      document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&document.activeElement===target)e.preventDefault();});
    updateUI();
      messageEl.textContent = 'Vai! Acchiappalo!';
      startBtn.textContent = 'In gioco...';
      target.classList.remove('caught');
      randomPos();
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft -= 1;
        updateUI();
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function resetGame() {
      clearInterval(timer);
      timer = null;
      score = 0;
      tries = 0;
      timeLeft = 30;
      running = false;
      updateUI();
      messageEl.textContent = 'Premi “Gioca” per iniziare.';
      startBtn.textContent = 'Gioca';
      target.classList.remove('caught');
      target.style.left = '50%';
      target.style.top = '50%';
      target.style.transform = 'translate(-50%, -50%)';
    }

    target.addEventListener('mouseenter', () => {
      if (!running) return;
      randomPos();
      target.style.width = (70 + Math.random() * 40) + 'px';
      target.style.height = target.style.width;
      messageEl.textContent = 'Ehi! Non così facile!';
    });

    target.addEventListener('click', () => {
      if (!running) return;
      score += 1;
      tries += 1;
      messageEl.textContent = score % 5 === 0 ? 'Bravo! Ti sta sfidando davvero.' : 'Preso! Ma ora scappa ancora più veloce!';
      target.style.width = (74 + Math.random() * 42) + 'px';
      target.style.height = target.style.width;
      randomPos();
      updateUI();
    });

    stage.addEventListener('click', (e) => {
      if (!running) return;
      if (e.target !== target) {
        tries += 1;
        messageEl.textContent = 'Hai mancato il bersaglio!';
        updateUI();
      }
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);
    commentsBtn.addEventListener('click', () => window.open('https://github.com/lorenzo365-prog/acchiappa-il-Bottone/discussions/1', '_blank'));
    funBtn.addEventListener('click', () => window.open('https://lorenzo365-prog.github.io/fun.games/', '_blank'));

    window.addEventListener('resize', () => {
      if (running) randomPos();
    });

    updateUI();
    randomPos();
  </script>
</body>
</html>
